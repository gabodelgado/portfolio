name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (sudoku engine + games compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Games compile
        run: python -m py_compile Volley/main.py Keystroke/main.py Nine/main.py Nine/sudoku.py

  browser:
    name: Browser (web apps + web games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
