# One-click deploy of Kitchen (Apron's backend) on Render: dashboard → New → Blueprint → pick this repo.
# The free plan sleeps when idle and its disk is temporary, so orders reset on each deploy — fine for a demo.
services:
  - type: web
    name: apron-kitchen
    runtime: python
    plan: free
    buildCommand: pip install -r Kitchen/requirements.txt
    startCommand: uvicorn Kitchen.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KITCHEN_TOKEN        # the kitchen board password; Render generates a random one
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://gabodelgado.github.io
