<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Gabriel Delgado</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #f6f2ea; }
    body { font-family: 'DM Sans', system-ui, sans-serif; color: #1e1b18; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .code { font-family: 'Fraunces', Georgia, serif; font-size: clamp(96px, 22vw, 180px); line-height: 1; letter-spacing: -4px; color: #c2410c; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-size: 30px; margin-top: 10px; }
    p { color: #6b6359; margin-top: 10px; font-size: 17px; }
    a { display: inline-block; margin-top: 26px; background: #1e1b18; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 12px; }
    a:focus-visible { outline: 3px solid #c2410c; outline-offset: 3px; }
</style>
</head>
<body>
<main>
    <div class="code">404</div>
    <h1 id="title">Esta página no existe</h1>
    <p id="sub">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <a href="/portfolio/" id="back">Ir al portafolio</a>
</main>
<script>
    if(!(navigator.language || 'es').toLowerCase().startsWith('es')){
        document.documentElement.lang = 'en';
        document.title = 'Page not found · Gabriel Delgado';
        document.getElementById('title').textContent = "This page doesn't exist";
        document.getElementById('sub').textContent = 'The link may be mistyped, or the page may have moved.';
        document.getElementById('back').textContent = 'Go to the portfolio';
    }
</script>
</body>
</html>
